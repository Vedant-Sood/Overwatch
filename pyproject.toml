[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigboss"
version = "0.1.0"
description = "BigBoss: local-first AI investment research platform (research and paper trading only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "lightgbm>=4.1",
  "statsmodels>=0.14",
  "duckdb>=1.0",
  "pyarrow>=14",
  "pydantic>=2.5",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "yfinance>=0.2.50",
]

[project.optional-dependencies]
xgb = ["xgboost>=2.0"]
nn = ["torch>=2.2"]
tune = ["optuna>=3.5"]
india = ["jugaad-data>=0.27"]
dev = ["pytest>=8"]
all = ["xgboost>=2.0", "torch>=2.2", "optuna>=3.5", "pytest>=8"]

[project.scripts]
bigboss = "bigboss.cli:main"

[tool.setuptools.packages.find]
include = ["bigboss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network: tests that call real external data providers (deselect with -m 'not network')",
  "slow: longer-running integration tests",
]
